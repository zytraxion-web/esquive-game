<!DOCTYPE html>
<html>
<head>
  <title>Esquive Game</title>
</head>
<body>
<canvas id="game" width="500" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ================= SAVE =================
let bestTime = parseFloat(localStorage.getItem("bestTime")) || 0;

// ================= STATE =================
let screen = "menu";
let difficulty = 1;

let player, obstacles = [], particles = [];

let lives = 3;
let timeAlive = 0;
let startTime = 0;

let countdown = 0;
let spawnProtection = 0;

let gameOverTimer = 0;

// ================= INIT =================
function startGame() {
  player = { x: 250, y: 200, size: 18 };

  obstacles = [];
  particles = [];

  lives = 3;
  startTime = performance.now();

  countdown = 180; // 3 sec
  spawnProtection = 0;

  screen = "play";
}

// ================= INPUT =================
canvas.addEventListener("mousemove", (e) => {
  if (screen !== "play") return;

  const r = canvas.getBoundingClientRect();
  player.x = e.clientX - r.left;
  player.y = e.clientY - r.top;
});

canvas.addEventListener("click", (e) => {
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left;
  const y = e.clientY - r.top;

  if (screen === "menu") {
    screen = "difficulty";
  }

  else if (screen === "difficulty") {

    if (y > 120 && y < 160) { difficulty = 1; startGame(); }
    if (y > 170 && y < 210) { difficulty = 2; startGame(); }
    if (y > 220 && y < 260) { difficulty = 4; startGame(); }
    if (y > 270 && y < 310) { difficulty = 5; startGame(); }
  }

  else if (screen === "gameover") {
    screen = "menu";
  }
});

// ================= PARTICLES =================
function explode(x, y, c) {
  for (let i = 0; i < 12; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      life: 30,
      color: c
    });
  }
}

// ================= ENEMY =================
function spawnEnemy() {

  let speed = 2 * difficulty;

  let r = Math.random();
  let type = "red";

  if (r < 0.15) type = "blue";
  else if (r < 0.30) type = "yellow";
  else if (r < 0.35) type = "life";

  let side = Math.floor(Math.random() * 4);
  let x, y;

  if (side === 0) { x = 0; y = Math.random() * 400; }
  if (side === 1) { x = 500; y = Math.random() * 400; }
  if (side === 2) { x = Math.random() * 500; y = 0; }
  if (side === 3) { x = Math.random() * 500; y = 400; }

  let dx = player.x - x;
  let dy = player.y - y;
  let dist = Math.max(0.001, Math.sqrt(dx*dx + dy*dy));

  obstacles.push({
    x, y,
    w: 18,
    h: 18,
    vx: (dx/dist)*speed,
    vy: (dy/dist)*speed,
    type
  });
}

// ================= GAME OVER FIX =================
function gameOver() {

  if (timeAlive > bestTime) {
    bestTime = timeAlive.toFixed(1);
    localStorage.setItem("bestTime", bestTime);
  }

  screen = "gameover";
}

// ================= UPDATE =================
function update() {

  if (screen === "gameover") {
    gameOverTimer++;
    return;
  }

  if (screen !== "play") return;

  timeAlive = (performance.now() - startTime) / 1000;

  // countdown
  if (countdown > 0) {
    countdown--;
    if (countdown === 0) spawnProtection = 180;
    return;
  }

  if (spawnProtection > 0) spawnProtection--;

  if (Math.random() < 0.05 * difficulty) {
    spawnEnemy();
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {

    let o = obstacles[i];

    o.x += o.vx;
    o.y += o.vy;

    let hit =
      player.x < o.x + o.w &&
      player.x + player.size > o.x &&
      player.y < o.y + o.h &&
      player.y + player.size > o.y;

    if (hit) {

      if (o.type === "life") {
        if (lives < 3) lives++;
        explode(player.x, player.y, "lime");
      }

      else if (spawnProtection <= 0) {
        lives--;
        explode(player.x, player.y, "red");

        if (lives <= 0) {
          gameOver();
        }
      }

      obstacles.splice(i, 1);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ================= UI =================
function drawHearts() {
  ctx.textAlign = "right";
  ctx.font = "20px Arial";

  for (let i = 0; i < lives; i++) {
    ctx.fillText("❤️", 490 - i * 25, 25);
  }
}

// ================= DRAW =================
function draw() {

  ctx.fillStyle = "#0b0f1a";
  ctx.fillRect(0, 0, 500, 400);

  ctx.textAlign = "center";

  // MENU
  if (screen === "menu") {
    ctx.fillStyle = "white";
    ctx.font = "28px Arial";
    ctx.fillText("ESQUIVE GAME", 250, 100);

    ctx.fillStyle = "#00cc66";
    ctx.fillRect(170, 200, 160, 60);

    ctx.fillStyle = "black";
    ctx.font = "20px Arial";
    ctx.fillText("JOUER", 250, 238);
    return;
  }

  // DIFFICULTY
  if (screen === "difficulty") {

    ctx.fillStyle = "white";
    ctx.font = "22px Arial";
    ctx.fillText("CHOISIS DIFFICULTÉ", 250, 80);

    let t = ["FACILE x1", "DIFFICILE x2", "EXTRÊME x4", "IMPOSSIBLE x5"];

    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = "#00cc66";
      ctx.fillRect(150, 120 + i * 50, 200, 35);

      ctx.fillStyle = "black";
      ctx.font = "16px Arial";
      ctx.fillText(t[i], 250, 145 + i * 50);
    }
    return;
  }

  // GAME
  let blink = spawnProtection > 0 && Math.floor(performance.now()/250)%2===0;

  if (!blink) {
    ctx.fillStyle = "deepskyblue";
    ctx.fillRect(player.x, player.y, player.size, player.size);
  }

  for (let o of obstacles) {
    ctx.fillStyle =
      o.type === "blue" ? "cyan" :
      o.type === "yellow" ? "yellow" : "red";

    ctx.fillRect(o.x, o.y, o.w, o.h);
  }

  // particles
  for (let p of particles) {
    ctx.globalAlpha = p.life / 30;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 3, 3);
  }
  ctx.globalAlpha = 1;

  // HUD
  ctx.fillStyle = "white";
  ctx.font = "14px Arial";
  ctx.textAlign = "left";

  ctx.fillText("Temps: " + timeAlive.toFixed(1), 10, 20);
  ctx.fillText("Record: " + bestTime + "s", 10, 40);

  ctx.fillStyle = "#ffcc00";
  ctx.fillText("Difficulté x" + difficulty, 10, 390);

  drawHearts();

  // countdown
  if (countdown > 0) {
    ctx.fillStyle = "white";
    ctx.font = "60px Arial";
    ctx.fillText(Math.ceil(countdown/60), 250, 200);
  }

  // GAME OVER
  if (screen === "gameover") {
    ctx.fillStyle = "rgba(255,0,0,0.6)";
    ctx.fillRect(0, 0, 500, 400);

    ctx.fillStyle = "white";
    ctx.font = "40px Arial";
    ctx.fillText("GAME OVER", 250, 200);
  }
}

// ================= LOOP =================
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
